# Existing signing/version/upload steps are preserved; retired inference artifacts are no longer fetched.
build:
  name: iOS Simulator build (development)
  steps:
    - eas/checkout

    - eas/install_node_modules

    - eas/prebuild

    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install

    - eas/generate_gymfile_from_template

    - eas/run_fastlane

    - eas/find_and_upload_build_artifacts
