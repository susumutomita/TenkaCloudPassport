name: issue155-cleanup

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cleanup:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'agent/155-conversation-example') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/155-conversation-example') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/155-conversation-example
          fetch-depth: 0

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76

      - name: Setup Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.13.1"

      - name: Setup safe-chain
        run: |
          bun add -g --ignore-scripts @aikidosec/safe-chain@1.5.3
          safe-chain setup-ci

      - name: Install packages from frozen bun.lock
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci INSTALL_CI_FLAGS=--safe-chain-skip-minimum-package-age

      - name: Apply formatter and restore standard CI
        run: |
          bun biome check --write .
          git fetch origin agent/155-text-content-guards --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/issue155-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: restore standard gates after Issue 155 diagnostics"
          git push origin HEAD:agent/155-conversation-example
