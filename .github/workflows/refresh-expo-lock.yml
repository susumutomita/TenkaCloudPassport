name: refresh-expo-lock

on:
  push:
    branches:
      - agent/simplify-agent-harness

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Refresh Expo-compatible dependency versions
        run: >-
          bun add --ignore-scripts
          '@expo/metro-runtime@~57.0.8'
          'expo@~57.0.9'
          'expo-build-properties@~57.0.8'
          'expo-dev-client@~57.0.10'
          'react-native@0.86.2'

      - name: Verify Expo compatibility
        run: bun run expo:check

      - name: Commit the generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(deps): align Expo SDK patch versions'
          git push origin "HEAD:${GITHUB_REF_NAME}"
