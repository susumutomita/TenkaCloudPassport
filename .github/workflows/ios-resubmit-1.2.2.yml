name: ios-processing-1.2.2

on:
  push:
    branches: [release/resubmit-1.2.2-build-14]
    paths: [.github/workflows/ios-resubmit-1.2.2.yml]

permissions:
  contents: read

concurrency:
  group: ios-submit-d726ae3e-fe94-4042-bdfe-5975c5f2a930
  cancel-in-progress: false

jobs:
  inspect-apple-processing:
    runs-on: ubuntu-latest
    steps:
      - name: Read Apple processing status for build 14
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          query = '''query ExistingReleaseSubmissionStatus($id: ID!) {
            builds { byId(buildId: $id) {
              id status platform appVersion appBuildVersion gitCommitHash project { id }
              submissions { id status
                appStoreConnectBuildUpload { version buildNumber uploadState
                  appStoreConnectBuild { buildNumber processingState uploadedDate }
                }
              }
            } }
          }'''
          request = urllib.request.Request('https://api.expo.dev/graphql',
              data=json.dumps({'query': query, 'variables': {
                  'id': 'd726ae3e-fe94-4042-bdfe-5975c5f2a930'}}).encode(),
              headers={'Content-Type': 'application/json', 'User-Agent': 'eas-cli/21.0.2',
                  'Authorization': 'Bearer ' + os.environ['EXPO_TOKEN']})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except Exception:
              raise SystemExit('Final EAS status query failed')
          if result.get('errors'):
              raise SystemExit('Final EAS status query returned errors')
          build = result['data']['builds']['byId']
          expected = {'id': 'd726ae3e-fe94-4042-bdfe-5975c5f2a930', 'status': 'FINISHED',
              'platform': 'IOS', 'appVersion': '1.2.2', 'appBuildVersion': '14',
              'gitCommitHash': '5bbdb1bd0312093410420e542b66dcd1265636c8'}
          if any(build.get(key) != value for key, value in expected.items()):
              raise SystemExit('Build identity mismatch')
          if build['project']['id'] != '82efa217-a2ac-4209-a975-ea7198a51cda':
              raise SystemExit('EAS project mismatch')
          print(json.dumps(expected))
          for submission in build['submissions']:
              print(json.dumps({'submissionId': submission['id'], 'status': submission['status'],
                  'appleBuildUpload': submission.get('appStoreConnectBuildUpload')}))
