name: store-inspection
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/store-inspection.yml
      - scripts/inspect-store-listing.ts
      - scripts/apply-store-listing.ts
      - scripts/store-inspection-context.ts
      - scripts/store-inspection-project/**
      - store.config.json
      - docs/release/app-store-submission-1.3.0.md
      - docs/assets/app-store-screenshots/v1.3.0/**
  workflow_dispatch:
    inputs:
      action:
        description: Store action (apply requires explicit owner approval)
        type: choice
        options: [inspect, apply, review-notes]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: passport-store-listing-6793516094
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.actor == 'susumutomita'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Require normally merged source for application
        run: |
          # The owner explicitly authorized this fixed 1.3.0 listing update.
          # Secret-bearing code runs only after normal merge to protected main.
          test '${{ github.actor }}' = susumutomita
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Existing pinned EAS toolchain
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # The historical metadata adapter checks this exact private API version.
          # Current app builds use EAS CLI 25.3.0 separately.
          bun add -g --ignore-scripts eas-cli@21.0.2
          python3 - <<'PY' >> "$GITHUB_ENV"
          import pathlib,shutil
          print('EAS_CLI_ROOT=' + str(pathlib.Path(shutil.which('eas')).resolve().parent.parent))
          PY
      - name: Read or synchronize verified listing
        working-directory: scripts/store-inspection-project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Only the first push run of this exact approved merge may update Notes.
          # Later pushes and reruns remain read-only, even if the draft is still editable.
          STORE_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.run_attempt == 1 && github.event.before == '94839cbd326fa165ad9558daff0f4266b5ead59e' && github.event.head_commit.message == 'Correct approved 1.3.0 review Notes (#207)' && 'review-notes' || 'inspect') }}
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOTENV: "1"
        run: node --experimental-strip-types ../inspect-store-listing.ts "$STORE_ACTION"
