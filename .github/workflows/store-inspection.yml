name: store-inspection
on:
  push:
    branches: [fix/store-listing-1.3.0, release/sync-store-1.3.0]
    paths:
      - .github/workflows/store-inspection.yml
      - scripts/inspect-store-listing.ts
      - scripts/apply-store-listing.ts
      - store.config.json
      - docs/assets/app-store-screenshots/v1.3.0/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.13.1'
      - name: Existing pinned EAS toolchain
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun add -g --ignore-scripts eas-cli@21.0.2
          python3 - <<'PY' >> "$GITHUB_ENV"
          import pathlib,shutil
          print('EAS_CLI_ROOT=' + str(pathlib.Path(shutil.which('eas')).resolve().parent.parent))
          PY
      - name: Require normally merged source for application
        if: github.ref_name == 'release/sync-store-1.3.0'
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Read or synchronize verified listing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: node --experimental-strip-types scripts/inspect-store-listing.ts ${{ github.ref_name == 'release/sync-store-1.3.0' && 'apply' || 'inspect' }}
